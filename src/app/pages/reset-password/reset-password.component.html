<div
  class="px-6 py-20 md:px-20 lg:px-80 flex items-center justify-center bg-blue-950 min-h-screen"
  >
  <div
    class="px-8 md:px-12 lg:px-20 py-12 flex flex-col items-center gap-12 w-full backdrop-blur-2xl rounded-2xl bg-gray-100 border border-surface-950 max-w-sm">
    <div class="flex flex-col items-center gap-4 w-full">
      <div class="flex flex-col gap-2 w-full">
        <div class="text-center text-3xl font-medium text-white leading-tight">
          <img src="/assets/logo-navbar.png" />
        </div>
      </div>
      <p class="text-center text-sm text-gray-600">Defina sua nova senha.</p>
    </div>

    @if (tokenMissing) {
      <p class="text-center text-sm text-red-700">
        Link inválido. Solicite uma nova redefinição de senha.
      </p>
    } @else {
      <div class="flex flex-col items-center gap-8 w-full">
        <div class="flex flex-col gap-6 w-full">
          <p-iconfield icon-position="left">
            <p-inputicon class="pi pi-lock"></p-inputicon>
            <input pInputText
              [type]="showPassword ? 'text' : 'password'"
              [(ngModel)]="password"
              class="w-full"
              placeholder="Nova senha" />
            <p-inputicon
              [class]="showPassword ? 'pi pi-eye-slash cursor-pointer' : 'pi pi-eye cursor-pointer'"
              style="right: 0.75rem; left: auto; pointer-events: all;"
              (click)="showPassword = !showPassword">
            </p-inputicon>
          </p-iconfield>
          <p-iconfield icon-position="left">
            <p-inputicon class="pi pi-lock"></p-inputicon>
            <input pInputText
              [type]="showPassword ? 'text' : 'password'"
              [(ngModel)]="confirmPassword"
              class="w-full"
              placeholder="Confirmar nova senha"
              (keydown.enter)="onSubmit()" />
          </p-iconfield>
        </div>
        <button pButton (click)="onSubmit()" [loading]="loading"
          class="w-full! bg-surface-950! border! border-surface-950! text-white! hover:bg-surface-950/80!">
          <span pButtonLabel>Redefinir senha</span>
        </button>
      </div>
    }

    <div class="flex flex-col items-center gap-2">
      <a routerLink="/login" class="text-blue-700 underline text-sm">Voltar ao login</a>
    </div>
  </div>
</div>

<p-toast></p-toast>
