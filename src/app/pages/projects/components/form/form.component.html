<app-sidebar />
<div class="p-4 sm:ml-64 pt-4">
  <p-breadcrumb [model]="breadcrumbItems" [home]="breadcrumbHome" class="mb-4 block" />
  <p-card [header]="id ? 'Editar Projeto' : 'Novo Projeto'" class="align-items-center mb-4">

    <h3 class="text-base font-semibold mb-3 mt-1">Dados Gerais</h3>
    <div class="grid grid-cols-1 gap-4">
      <div class="field">
        <label for="title" class="block mb-2">Título <span class="text-red-500">*</span></label>
        <input
          id="title"
          type="text"
          pInputText
          [(ngModel)]="project.title"
          placeholder="Título do projeto"
          class="w-full" />
      </div>

      <div class="field">
        <label for="description" class="block mb-2">Descrição</label>
        <textarea
          id="description"
          pTextarea
          [(ngModel)]="project.description"
          rows="4"
          placeholder="Descreva o escopo do projeto..."
          class="w-full"></textarea>
      </div>
    </div>

    <div class="grid grid-cols-1 md:grid-cols-3 gap-4 mt-4">
      <div class="field">
        <label for="customerId" class="block mb-2">Cliente</label>
        <p-select
          [options]="customers"
          [(ngModel)]="project.customerId"
          optionLabel="name"
          optionValue="value"
          placeholder="Sem cliente vinculado"
          [filter]="true"
          [showClear]="true"
          filterPlaceholder="Buscar cliente..."
          class="w-full" />
      </div>

      <div class="field">
        <label for="priority" class="block mb-2">Prioridade</label>
        <p-select
          [options]="optionPriority"
          [(ngModel)]="project.priority"
          optionLabel="name"
          optionValue="value"
          placeholder="Selecione..."
          class="w-full" />
      </div>

      <div class="field">
        <label for="statusId" class="block mb-2">Status</label>
        <p-select
          [options]="statuses"
          [(ngModel)]="project.statusId"
          optionLabel="name"
          optionValue="value"
          placeholder="Selecione o status..."
          class="w-full" />
      </div>

      <div class="field">
        <label for="startDate" class="block mb-2">Data de Início</label>
        <p-datepicker
          [(ngModel)]="project.startDate"
          dateFormat="dd/mm/yy"
          [showIcon]="true"
          placeholder="Selecione a data"
          class="w-full" />
      </div>

      <div class="field">
        <label for="endDate" class="block mb-2">Data Fim (prazo planejado)</label>
        <p-datepicker
          [(ngModel)]="project.endDate"
          dateFormat="dd/mm/yy"
          [showIcon]="true"
          placeholder="Selecione a data"
          class="w-full" />
      </div>

      <div class="field">
        <label for="hourlyRate" class="block mb-2">Valor / Hora</label>
        <p-inputNumber
          [(ngModel)]="project.hourlyRate"
          mode="currency"
          currency="BRL"
          locale="pt-BR"
          [min]="0"
          class="w-full" />
      </div>
    </div>

    <div class="flex mt-6 gap-2">
      <p-button label="Voltar" severity="secondary" [loading]="loading" (click)="onBack()"></p-button>
      <p-button label="Salvar" [loading]="loading" (click)="onSubmit()"></p-button>
    </div>

  </p-card>
</div>
<p-toast />
